name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release recovery without publishing
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@17ee7092d5ff1748164185ff37fcff5214f9f870 # v20.1.5
    with:
      dry-run: ${{ inputs.dry-run || false }}
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
      protected-release: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
